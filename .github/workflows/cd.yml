name: CD

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        required: true
        type: choice
        options:
          - all
          - craftty-ink
          - craftty

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ inputs.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace -- -D warnings
          cargo nextest run --workspace

      - name: Install cocogitto
        uses: taiki-e/install-action@v2
        with:
          tool: cocogitto@7

      - name: Configure git
        run: |
          git config user.name "craftty-bot"
          git config user.email "craftty-bot@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          tags_before=$(git tag --list | sort)
          if [ "$PACKAGE" = "all" ]; then
            cog bump --auto
          else
            cog bump --auto --package "$PACKAGE"
          fi
          tags_after=$(git tag --list | sort)
          new_tags=$(comm -13 <(echo "$tags_before") <(echo "$tags_after"))
          if [ -z "$new_tags" ]; then
            echo "::error::No version bump was produced. Nothing to publish."
            exit 1
          fi
          echo "New tags: $new_tags"
          echo "$new_tags" | grep -q "^craftty-ink-v" && echo "ink=true" >> "$GITHUB_OUTPUT" || echo "ink=false" >> "$GITHUB_OUTPUT"
          echo "$new_tags" | grep -q "^craftty-v" && echo "craftty=true" >> "$GITHUB_OUTPUT" || echo "craftty=false" >> "$GITHUB_OUTPUT"
          global_tag=$(echo "$new_tags" | grep "^v" | head -1)
          if [ -n "$global_tag" ]; then
            echo "global_tag=$global_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Push commits and tags
        run: |
          git push
          git push --tags

      - name: Generate release notes
        if: steps.bump.outputs.global_tag != ''
        env:
          GLOBAL_TAG: ${{ steps.bump.outputs.global_tag }}
        run: cog changelog --at "$GLOBAL_TAG" -t remote > RELEASE_NOTES.md

      - name: Create GitHub Release
        if: steps.bump.outputs.global_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.global_tag }}
          body_path: RELEASE_NOTES.md

      - name: Publish craftty-ink
        if: steps.bump.outputs.ink == 'true'
        run: cargo publish -p craftty-ink
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        if: steps.bump.outputs.ink == 'true' && steps.bump.outputs.craftty == 'true'
        run: sleep 30

      - name: Publish craftty
        if: steps.bump.outputs.craftty == 'true'
        run: cargo publish -p craftty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
