name: CD

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        required: true
        type: choice
        options:
          - all
          - craftty-ink
          - craftty

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ inputs.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace -- -D warnings
          cargo nextest run --workspace

      - uses: cocogitto/cocogitto-action@v3

      - name: Configure git
        run: |
          git config user.name "craftty-bot"
          git config user.email "craftty-bot@users.noreply.github.com"

      - name: Bump version
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = "all" ]; then
            cog bump --auto
          else
            cog bump --auto --package "$PACKAGE"
          fi

      - name: Push commit and tag
        run: git push --follow-tags

      - name: Publish craftty-ink
        if: inputs.package == 'all' || inputs.package == 'craftty-ink'
        run: cargo publish -p craftty-ink
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish craftty
        if: inputs.package == 'all' || inputs.package == 'craftty'
        run: cargo publish -p craftty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
