name: CD

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        required: true
        type: choice
        options:
          - all
          - craftty-ink
          - craftty

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ inputs.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace -- -D warnings
          cargo nextest run --workspace

      - name: Bump version
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto ${{ inputs.package != 'all' && format('--package {0}', inputs.package) || '' }}
          git-user: craftty-bot
          git-user-email: craftty-bot@users.noreply.github.com

      - name: Push commit and tag
        run: git push --follow-tags

      - name: Publish craftty-ink
        if: inputs.package == 'all' || inputs.package == 'craftty-ink'
        run: cargo publish -p craftty-ink
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish craftty
        if: inputs.package == 'all' || inputs.package == 'craftty'
        run: cargo publish -p craftty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
